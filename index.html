<title>Salta!</title>
<style>
:root{--bg:#fdf6e3;--fg:#333;--plat:#4caf50;--pl:#ff7043;--blue:#42a5f5;--brown:#8d6e63;--red:#e53935}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2230;--fg:#eee;--plat:#66bb6a;--pl:#ffab91}}
:root[data-theme="dark"]{--bg:#1e2230;--fg:#eee;--plat:#66bb6a;--pl:#ffab91}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;background:var(--bg)}
#sa{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden}
#sel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--bg) 94%,transparent);color:var(--fg);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);z-index:5}
#sel h1{font-size:22px;margin:0}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(92vw,360px)}
#grid button{background:transparent;color:var(--fg);border:2px solid var(--fg);border-radius:14px;padding:8px 4px;font:600 16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
#grid button:active{background:var(--plat)}
#grid img{height:min(15vh,120px);width:auto;image-rendering:auto}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:4;background:var(--bg);color:var(--fg);border:2px solid var(--fg);border-radius:12px;padding:6px 12px;font:600 15px system-ui,sans-serif;cursor:pointer}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center;z-index:6;padding:20px}
#win h1{font-size:clamp(38px,13vw,84px);margin:0;color:var(--pl)}
#win p{margin:0;font-size:16px;opacity:.8}
</style>
</head>

  plats.push(q);
  if(R()<0.25+diff*0.15)plats.push({x:R()*(W-60),y:y-20-R()*25,t:2,broken:false,vy:0});
  if(score>400&&R()<0.035+diff*0.06)ens.push({x:R()*(W-30),y:y-45-R()*20,vx:(R()<.5?-1:1)*(0.7+R()),ph:R()*6});
}
function reset(){
  p={x:145,y:H-90,vy:-10,w:44,h:52,jet:0};
  plats=[{x:130,y:H-30,t:0,item:null}];ens=[];score=0;diff=0;dead=false;lastGot=0;popT=0;lastY=H-30;
  while(lastY>-40){lastY-=45+R()*35;spawn(lastY)}
}
function step(){
  if(dead||!started||won)return;
  if(popT>0)popT--;
  diff=Math.min(1,score/30000);
  p.x+=dir*5;
  if(p.x>W)p.x=-p.w;if(p.x<-p.w)p.x=W;
  if(p.jet>0){p.jet--;p.vy=-12}else p.vy+=0.35;
  p.y+=p.vy;
  plats.forEach(q=>{
    if(q.t==1){q.x+=q.vx;if(q.x<0||q.x>W-60)q.vx*=-1}
    if(q.t==2&&q.broken){q.vy+=0.4;q.y+=q.vy}
    if(q.item=='jet'&&p.jet<=0&&Math.abs(p.x+15-(q.x+30))<28&&p.y<q.y&&p.y+p.h>q.y-24){q.item=null;p.jet=90}
  });
  if(p.vy>0&&p.jet<=0)for(const q of plats){
    if(q.broken)continue;
    if(p.x+p.w>q.x&&p.x<q.x+60&&p.y+p.h>q.y&&p.y+p.h<q.y+p.vy+10){
      if(q.t==2){q.broken=true;q.vy=0}
      p.vy=q.item=='spring'?-17:-10.5;break;
    }
  }
  for(const e of ens){
    e.x+=e.vx;if(e.x<0||e.x>W-30)e.vx*=-1;e.ph+=.08;
    if(p.x+p.w>e.x&&p.x<e.x+30&&p.y+p.h>e.y&&p.y<e.y+30){
      if(p.jet>0){e.dead=true}
      else if(p.vy>0&&p.y+p.h<e.y+18){e.dead=true;p.vy=-11;score+=500}
      else dead=true;
    }
  }
  ens=ens.filter(e=>!e.dead);
  const T=H*0.42;if(p.y<T){const d=T-p.y;p.y=T;score+=d;lastY+=d;plats.forEach(q=>q.y+=d);ens.forEach(e=>e.y+=d)}
  plats=plats.filter(q=>q.y<H+20);ens=ens.filter(e=>e.y<H);
  while(lastY>-40){lastY-=45+R()*(35+diff*30);spawn(lastY)}
  const got=Math.min(10,Math.floor(score/1000));
  if(got>lastGot){popK=got-1;popT=20}lastGot=got;
  if(score>=10000){won=true;document.getElementById('win').style.display='flex';return}
  if(p.y>H)reset();
}
function draw(){
  g.setTransform(K,0,0,K,0,0);g.imageSmoothingQuality='high';
  g.clearRect(0,0,W+2,H+2);
  {const T=['AUGURI','VERO'],got=Math.min(10,Math.floor(score/1000));let k=0;
   g.font='bold 54px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillStyle=css('--pl');
   T.forEach((w,li)=>{const y=H/2-30+li*70;
    for(let i=0;i<w.length;i++,k++){if(k>=got)continue;const x=W/2+(i-(w.length-1)/2)*48,
     pop=(k==popK&&popT>0)?1+popT/20*0.6:1;
     g.save();g.translate(x,y);g.scale(pop,pop);g.globalAlpha=.28;g.fillText(w[i],0,0);g.restore()}});
   g.globalAlpha=1;g.textBaseline='alphabetic';g.textAlign='left'}
  plats.forEach(q=>{
    g.fillStyle=q.t==1?css('--blue'):q.t==2?css('--brown'):css('--plat');
    g.fillRect(q.x,q.y,60,10);
    if(q.t==2){g.fillStyle=css('--bg');g.fillRect(q.x+28,q.y,4,10)}
    if(q.item=='spring'){g.fillStyle='#fbc02d';g.fillRect(q.x+22,q.y-9,16,9)}
    if(q.item=='jet'){g.fillStyle='#ab47bc';g.beginPath();g.arc(q.x+30,q.y-12,10,0,7);g.fill()}
  });
  ens.forEach(e=>{
    const w=Math.sin(e.ph)*3;
    g.fillStyle=css('--red');g.fillRect(e.x,e.y+w,30,26);
    g.fillStyle='#fff';g.fillRect(e.x+6,e.y+w+6,7,7);g.fillRect(e.x+18,e.y+w+6,7,7);
    g.fillStyle='#000';g.fillRect(e.x+8,e.y+w+8,3,3);g.fillRect(e.x+20,e.y+w+8,3,3);
  });
  g.drawImage(img,p.x,p.y,p.w,p.h);
  if(p.jet>0){g.fillStyle='#ab47bc';g.fillRect(p.x+8,p.y+p.h,14,8+R()*8)}
  g.fillStyle=css('--fg');g.font='13px system-ui';g.textAlign='left';
  g.fillText('Punti: '+Math.floor(score/10),8,safeTop+22);
  if(started&&hint>0&&!dead){hint--;g.globalAlpha=Math.min(1,hint/60);g.textAlign='center';g.font='12px system-ui';
    g.fillText('Tocca sinistra/destra per muoverti',W/2,H-60);
    g.fillText('Blu: mobili · Marroni: si rompono',W/2,H-44);
    g.fillText('Molla gialla · Jetpack viola · Salta sui nemici!',W/2,H-28);g.globalAlpha=1;g.textAlign='left'}
  if(dead){g.textAlign='center';g.font='24px system-ui';
    g.fillText('Game over',W/2,H/2);g.font='14px system-ui';
    g.fillText('Tocca per scegliere il personaggio',W/2,H/2+26)}
}
function loop(){step();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  if(e.key=='ArrowLeft'||e.key=='a')dir=-1;
  if(e.key=='ArrowRight'||e.key=='d')dir=1;
  if(e.key==' '&&dead)showSel();
  if(e.key==' '&&won)endWin();
});
addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))dir=0});
addEventListener('touchstart',e=>{
  if(!started||won)return;if(dead){showSel();return}
  dir=e.touches[0].clientX<innerWidth/2?-1:1;
});
addEventListener('touchend',()=>dir=0);
c.addEventListener('mousedown',()=>{if(started&&dead)showSel()});
function endWin(){won=false;document.getElementById('win').style.display='none';showSel()}
document.getElementById('win').onclick=endWin;
const menu=document.getElementById('menu');
menu.onclick=showSel;
menu.addEventListener('touchstart',e=>e.stopPropagation());
function showSel(){started=false;dir=0;hint=400;reset();document.getElementById('sel').style.display='flex'}
const grid=document.getElementById('grid');
for(const n in SPR){
  const b=document.createElement('button');
  b.innerHTML='<img alt="" src="'+SPR[n]+'"><span>'+n+'</span>';
  b.onclick=()=>{img.src=SPR[n];document.getElementById('sel').style.display='none';reset();started=true};
  grid.appendChild(b);
}
img.src=SPR.Giada;
reset();loop();
</script>
